<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f5f4a">
  <title>FAH – vurderingsverktøy</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f5}
    #app{display:block;width:100%;height:100%;border:0;background:#f4f7f5}
  </style>
</head>
<body>
  <iframe id="app" src="app-core.html?v=25" title="FAH – vurderingsverktøy"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      try{
        const d=frame.contentDocument;
        const css=d.createElement('link');
        css.rel='stylesheet';
        css.href='lab-layout.css?v=25';
        d.head.appendChild(css);

        const js=d.createElement('script');
        js.src='lab-layout.js?v=25';
        js.onload=()=>{
          const printJs=d.createElement('script');
          printJs.src='print-sheet.js?v=25';
          d.body.appendChild(printJs);
        };
        d.body.appendChild(js);
      }catch(err){
        console.error('Kunne ikke laste vurderingslayout:',err);
      }
    });
  </script>
</body>
</html>
